<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../../site.webmanifest">
  <link rel="icon" href="../../favicon.png">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <title>Shape Detective</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243449;background:#f5f8fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 10% 0%,#dff6f0,transparent 32rem),radial-gradient(circle at 95% 10%,#e5e9ff,transparent 30rem),#f5f8fc}
    button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #254fb3;outline-offset:3px}
    .shell{max-width:960px;margin:auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .home{color:#344a64;text-decoration:none;font-weight:750;background:#fff;border:1px solid #dbe4ee;border-radius:16px;padding:11px 15px;white-space:nowrap}
    .brand{font-weight:850;font-size:clamp(1.2rem,4vw,1.6rem);letter-spacing:-.03em;text-align:right}
    h1,h2,p{margin:0}h1{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.045em;line-height:1.08}h2{font-size:1.45rem;letter-spacing:-.025em}
    .eyebrow{font-size:.82rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#416b80;margin-bottom:9px}
    .sub{color:#5a6d80;line-height:1.5;margin-top:12px;max-width:42rem}
    .panel{background:#fff;border:1px solid #e0e8f1;border-radius:28px;box-shadow:0 14px 38px #2b486014;padding:clamp(18px,4vw,32px)}
    [hidden]{display:none!important}.menu-head{margin:14px 0 25px}.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .mode{border:2px solid #e1e8f0;border-radius:22px;background:#fff;text-align:left;padding:22px;min-height:220px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,border-color .15s,box-shadow .15s}
    .mode:hover{transform:translateY(-3px);border-color:#88c9b9;box-shadow:0 10px 22px #2b486014}.mode:active{transform:scale(.985)}.mode strong{font-size:1.22rem}.mode span:last-child{color:#5b6e81;line-height:1.4}
    .mode-icon{font-size:2.5rem;background:#eaf8f2;border-radius:18px;width:66px;height:66px;display:grid;place-items:center}
    .note{margin-top:18px;color:#657789;font-size:.94rem}
    .game-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.quiet{background:#fff;border:1px solid #dbe4ee;border-radius:13px;padding:10px 14px;color:#344a64;font-weight:700}
    .progress{height:9px;border-radius:99px;background:#e6edf4;overflow:hidden;margin:0 0 22px}.progress>div{height:100%;background:#49b69b;border-radius:99px;transition:width .25s}
    .question-area{text-align:center}.question-area h1{font-size:clamp(1.65rem,5.8vw,3rem)}.question-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
    .speak{border:0;background:#e8f1ff;color:#2453a6;border-radius:50%;width:50px;height:50px;font-size:1.45rem;flex:none}.speak:hover{background:#d7e8ff}
    .example{min-height:176px;display:grid;place-items:center;margin:18px auto 4px}.example svg{height:148px;width:148px;max-width:100%}
    .answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px}.answers.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:570px;margin-left:auto;margin-right:auto}
    .answer{border:2px solid #dfe8f1;background:#fff;border-radius:22px;min-height:154px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#273c53;font-size:clamp(1.05rem,3.6vw,1.35rem);font-weight:800;box-shadow:0 5px 0 #dfe8f1;transition:transform .15s,border-color .15s,background .15s}
    .answer svg{width:95px;height:95px}.answer:hover:not(:disabled){border-color:#52af9a;transform:translateY(-3px)}.answer:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #dfe8f1}.answer:disabled{cursor:default}
    .answer.correct{border-color:#23a67e;background:#e8f9f1;box-shadow:0 5px 0 #a5ddcb}.answer.wrong{border-color:#e78283;background:#fff0ef;box-shadow:0 5px 0 #f3c4c1}.answer.hint{border-color:#49a983;box-shadow:0 0 0 4px #bfe8d3}
    .feedback{min-height:55px;text-align:center;margin-top:20px;font-size:1.08rem;line-height:1.45;font-weight:650}.feedback.success{color:#137751}.feedback.try{color:#a74442}
    .next{display:block;margin:8px auto 0;background:#244d86;color:#fff;border:0;border-radius:16px;padding:14px 28px;min-width:170px;font-weight:800;font-size:1.06rem}
    .summary{text-align:center}.summary h1{margin:10px 0}.summary .sub{margin:0 auto 18px}.summary-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:490px;margin:18px auto 24px;text-align:left}.summary-item{padding:13px;border-radius:14px;background:#f1f6fa;font-weight:750}.summary-item small{display:block;color:#5c7182;font-weight:500;margin-top:3px}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{background:#244d86;color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:750}.actions button.secondary{background:#e9f0f6;color:#29435c}
    @media(max-width:650px){.mode-grid{grid-template-columns:1fr}.mode{min-height:0;display:grid;grid-template-columns:62px 1fr;gap:2px 15px;align-items:center;padding:16px}.mode-icon{grid-row:span 2;width:58px;height:58px;font-size:2rem}.mode span:last-child{font-size:.92rem}.answers{gap:9px}.answer{min-height:130px;padding:9px;border-radius:17px}.answer svg{width:70px;height:70px}.panel{border-radius:22px}.example{min-height:140px}.example svg{height:125px;width:125px}}
    @media(max-width:390px){.answers{gap:6px}.answer{font-size:1rem;min-height:115px}.answer svg{height:61px;width:61px}.brand{font-size:1.05rem}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="home" href="../../index.html">🏠 Games</a><div class="brand">🔎 Shape Detective</div></header>
    <main>
      <section id="menu" class="panel">
        <div class="menu-head"><p class="eyebrow">Look · Listen · Match</p><h1>Shapes have names!</h1><p class="sub">Choose how to play. Start with simple shapes, then match their English names and spot them in the world.</p></div>
        <div class="mode-grid">
          <button class="mode" data-mode="find"><span class="mode-icon">🔍</span><strong>Find the shape</strong><span>Hear a shape word. Tap the matching shape. 2 choices.</span></button>
          <button class="mode" data-mode="name"><span class="mode-icon">🔤</span><strong>Match the word</strong><span>Look at a shape. Choose its English name. 3 choices.</span></button>
          <button class="mode" data-mode="world"><span class="mode-icon">🌎</span><strong>Shapes around us</strong><span>Look at a familiar object. Choose its shape. 3 choices.</span></button>
        </div><p class="note">Four 2D shapes: circle, square, triangle and rectangle. No timer.</p>
      </section>
      <section id="game" hidden>
        <div class="game-head"><span id="step-label" class="eyebrow" style="margin:0"></span><button id="change-mode" class="quiet">Change game</button></div>
        <div class="progress" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="8"><div id="progress-fill"></div></div>
        <div class="panel"><div class="question-area"><p id="mode-label" class="eyebrow"></p><div class="question-row"><h1 id="question"></h1><button id="speak" class="speak" type="button" aria-label="Hear the question" title="Hear the question">🔊</button></div><div id="example" class="example" hidden></div></div>
          <div id="answers" class="answers"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="next" hidden>Next →</button>
        </div>
      </section>
      <section id="summary" class="panel summary" hidden><p class="eyebrow">Case closed!</p><h1>Great detective work! ✨</h1><p id="result" class="sub"></p><div id="summary-list" class="summary-list"></div><div class="actions"><button id="again">Play again</button><button id="choose" class="secondary">Choose another game</button></div></section>
    </main>
  </div>
  <script>
    'use strict';
    const SHAPES = [
      {id:'circle',name:'Circle',feature:'A circle is round. It has no corners.',color:'#f2a45e'},
      {id:'square',name:'Square',feature:'A square has 4 equal sides.',color:'#69bda6'},
      {id:'triangle',name:'Triangle',feature:'A triangle has 3 sides.',color:'#a792e9'},
      {id:'rectangle',name:'Rectangle',feature:'A rectangle has 4 sides: 2 long and 2 short.',color:'#77a9e9'}
    ];
    const OBJECTS = {
      circle:{name:'plate',feature:'The plate is round, like a circle.'},
      square:{name:'square tile',feature:'The tile has 4 equal sides, like a square.'},
      triangle:{name:'triangle road sign',feature:'The sign has 3 sides, like a triangle.'},
      rectangle:{name:'door',feature:'The door has 2 long sides and 2 short sides, like a rectangle.'}
    };
    const $ = id => document.getElementById(id);
    const byId = Object.fromEntries(SHAPES.map(shape => [shape.id,shape]));
    let mode='find', deck=[], step=0, firstTry={}, attempts=0, locked=false, timer=null;
    function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function shapeSVG(id){
      const shape=byId[id], common=`fill="${shape.color}" stroke="#263e56" stroke-width="4" stroke-linejoin="round"`;
      const path={circle:`<circle cx="60" cy="60" r="40" ${common}/>`,square:`<rect x="22" y="22" width="76" height="76" rx="3" ${common}/>`,triangle:`<path d="M60 17 L104 96 H16 Z" ${common}/>`,rectangle:`<rect x="15" y="31" width="90" height="58" rx="3" ${common}/>`}[id];
      return `<svg viewBox="0 0 120 120" aria-hidden="true">${path}</svg>`;
    }
    function objectSVG(id){
      const art={
        circle:'<ellipse cx="60" cy="61" rx="47" ry="42" fill="#f2a45e" stroke="#263e56" stroke-width="4"/><ellipse cx="60" cy="61" rx="31" ry="27" fill="#fff8ed" stroke="#cb7956" stroke-width="3"/>',
        square:'<rect x="15" y="15" width="90" height="90" rx="3" fill="#69bda6" stroke="#263e56" stroke-width="4"/><path d="M15 60H105M60 15V105" stroke="#e7fcf3" stroke-width="3"/>',
        triangle:'<path d="M60 9 L112 104 H8 Z" fill="#fff5e7" stroke="#d74c4c" stroke-width="9" stroke-linejoin="round"/><path d="M60 48v25" stroke="#263e56" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="85" r="3" fill="#263e56"/>',
        rectangle:'<rect x="26" y="8" width="68" height="104" rx="3" fill="#77a9e9" stroke="#263e56" stroke-width="4"/><rect x="36" y="19" width="48" height="39" rx="2" fill="#add2fc" stroke="#263e56" stroke-width="2"/><circle cx="78" cy="75" r="4" fill="#f8de83" stroke="#263e56" stroke-width="2"/>'
      };
      return `<svg viewBox="0 0 120 120" role="img" aria-label="${OBJECTS[id].name}">${art[id]}</svg>`;
    }
    function speak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-GB';utterance.rate=.82;window.speechSynthesis.speak(utterance)}
    function show(screen){for(const id of ['menu','game','summary'])$(id).hidden=id!==screen}
    function clearTimer(){if(timer){clearTimeout(timer);timer=null}if('speechSynthesis' in window)window.speechSynthesis.cancel()}
    function start(nextMode){clearTimer();mode=nextMode;deck=shuffle([...SHAPES,...SHAPES]);step=0;firstTry={};show('game');renderQuestion()}
    function optionsFor(target){const others=shuffle(SHAPES.filter(s=>s.id!==target.id));return shuffle([target,...others.slice(0,mode==='find'?1:2)])}
    function renderQuestion(){
      locked=false;attempts=0;const target=deck[step];$('step-label').textContent=`Question ${step+1} of ${deck.length}`;$('progress-fill').style.width=`${step/deck.length*100}%`;$('game').querySelector('.progress').setAttribute('aria-valuenow',String(step));
      $('mode-label').textContent={find:'Find the shape',name:'Match the word',world:'Shapes around us'}[mode];
      $('question').textContent=mode==='find'?`Find the ${target.name.toLowerCase()}`:mode==='name'?'What is this shape?':`What shape is the ${OBJECTS[target.id].name}?`;
      $('speak').setAttribute('aria-label',`Hear: ${$('question').textContent}`);
      $('example').hidden=mode==='find';$('example').innerHTML=mode==='name'?shapeSVG(target.id):mode==='world'?objectSVG(target.id):'';
      $('answers').classList.toggle('two',mode==='find');$('answers').innerHTML='';
      for(const shape of optionsFor(target)){
        const button=document.createElement('button');button.className='answer';button.type='button';button.dataset.id=shape.id;
        if(mode==='find'){button.innerHTML=shapeSVG(shape.id);button.setAttribute('aria-label',shape.name)}
        else button.textContent=shape.name;
        button.addEventListener('click',()=>answer(shape.id,button));$('answers').append(button);
      }
      $('feedback').textContent='';$('feedback').className='feedback';$('next').hidden=true;
    }
    function answer(id,button){
      if(locked)return;const target=deck[step];attempts++;
      if(!(step in firstTry))firstTry[step]=id===target.id;
      if(id!==target.id){
        button.classList.add('wrong');button.disabled=true;$('feedback').className='feedback try';
        $('feedback').textContent=attempts===1?'Have another look. You can do it!':`${target.name}: ${target.feature}`;
        if(attempts>=2){const right=$('answers').querySelector(`[data-id="${target.id}"]`);right.classList.add('hint')}
        return;
      }
      locked=true;button.classList.add('correct');for(const item of $('answers').children)item.disabled=true;
      $('feedback').className='feedback success';$('feedback').textContent=(mode==='world'?OBJECTS[target.id].feature:target.feature);
      $('next').textContent=step===deck.length-1?'See my shapes →':'Next →';$('next').hidden=false;speak(target.name);
    }
    function next(){clearTimer();if(!locked)return;step++;if(step===deck.length)finish();else renderQuestion()}
    function finish(){show('summary');$('result').textContent=`You knew ${Object.values(firstTry).filter(Boolean).length} of ${deck.length} on the first try. Every shape you practised counts!`;
      const list=$('summary-list');list.innerHTML='';for(const shape of SHAPES){const count=deck.reduce((n,item,i)=>n+(item.id===shape.id&&firstTry[i]?1:0),0);const el=document.createElement('div');el.className='summary-item';el.textContent=`${shape.name} ${count===2?'✓':'↗'}`;const small=document.createElement('small');small.textContent=count===2?'Great first tries':'Let’s practise again';el.append(small);list.append(el)}
    }
    document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>start(button.dataset.mode)));
    $('speak').addEventListener('click',()=>speak($('question').textContent));$('next').addEventListener('click',next);
    $('change-mode').addEventListener('click',()=>{clearTimer();show('menu')});$('again').addEventListener('click',()=>start(mode));$('choose').addEventListener('click',()=>{clearTimer();show('menu')});
  </script>
</body>
</html>
