<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>May's Space Adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (UMD) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #020617; /* slate-950 */ }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Inline SVG Icons to ensure zero external dependency issues on iPad
        const Icons = {
          Sun: () => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-full h-full">
              <circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
          ),
          Volume: () => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-full h-full">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
          ),
          Close: () => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-full h-full">
              <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
          ),
          Star: () => (
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-full h-full">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          ),
          Home: () => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-full h-full">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          )
        };

        const PLANETS = [
          { name: "Mercury", color: "#A5A5A5", size: 24, distance: 70, speed: 4.0, description: "Mercury is the smallest planet and the closest to the Sun. It is very hot during the day and freezing at night!", fact: "A year on Mercury is only 88 days long." },
          { name: "Venus", color: "#E3BB76", size: 32, distance: 110, speed: 3.0, description: "Venus is the hottest planet. It is covered in thick yellow clouds that trap heat like a blanket.", fact: "Venus spins in the opposite direction to most other planets." },
          { name: "Earth", color: "#2271B3", size: 36, distance: 160, speed: 2.2, description: "Earth is our beautiful home! It is the only planet we know that has life and lots of blue water.", fact: "Earth is the only planet not named after a god." },
          { name: "Mars", color: "#E27B58", size: 28, distance: 210, speed: 1.8, description: "Mars is called the 'Red Planet' because of its rusty soil. It has the biggest volcano in space!", fact: "Mars has two tiny moons called Phobos and Deimos." },
          { name: "Jupiter", color: "#D39C7E", size: 54, distance: 280, speed: 1.2, description: "Jupiter is the biggest planet! It is a gas giant with a famous Big Red Spot, which is a giant storm.", fact: "You could fit more than 1,300 Earths inside Jupiter!" },
          { name: "Saturn", color: "#C5AB6E", size: 48, distance: 360, speed: 0.9, description: "Saturn is famous for its beautiful rings made of ice and rock. It is very light for its huge size.", fact: "Saturn's rings are mostly made of chunks of ice and carbon dust." },
          { name: "Uranus", color: "#B5E2E2", size: 40, distance: 430, speed: 0.6, description: "Uranus is an ice giant. It is a lovely light blue colour and it actually spins on its side!", fact: "Uranus was the first planet discovered using a telescope." },
          { name: "Neptune", color: "#3E54E8", size: 40, distance: 490, speed: 0.5, description: "Neptune is the farthest planet from the Sun. It is very dark, cold, and has the strongest winds.", fact: "Neptune is 58 times bigger than Earth!" }
        ];

        function App() {
          const [selectedPlanet, setSelectedPlanet] = useState(null);
          const [isRotating, setIsRotating] = useState(true);
          const [showIntro, setShowIntro] = useState(true);
          const [stars, setStars] = useState([]);

          useEffect(() => {
            const newStars = Array.from({ length: 100 }).map((_, i) => ({
              id: i,
              left: `${Math.random() * 100}%`,
              top: `${Math.random() * 100}%`,
              size: Math.random() * 2 + 1,
              delay: Math.random() * 5
            }));
            setStars(newStars);
          }, []);

          const speak = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.rate = 0.85; // Slower for clarity
              utterance.pitch = 1.1;
              utterance.lang = 'en-GB';
              window.speechSynthesis.speak(utterance);
            }
          };

          const handlePlanetSelect = (planet) => {
            setSelectedPlanet(planet);
            speak(`${planet.name}. ${planet.description}`);
          };

          return (
            <div className="fixed inset-0 bg-slate-950 text-white overflow-hidden font-sans select-none touch-none">
              {/* Background Stars */}
              <div className="absolute inset-0">
                {stars.map(star => (
                  <div 
                    key={star.id}
                    className="absolute bg-white rounded-full opacity-40 animate-pulse"
                    style={{
                      left: star.left,
                      top: star.top,
                      width: `${star.size}px`,
                      height: `${star.size}px`,
                      animationDelay: `${star.delay}s`
                    }}
                  />
                ))}
              </div>

              {/* Main Space Scene */}
              <div className="relative w-full h-full flex items-center justify-center overflow-auto p-20">
                <div className="relative min-w-[1000px] min-h-[1000px] flex items-center justify-center">
                  
                  {/* The Sun */}
                  <div 
                    className="z-20 w-32 h-32 rounded-full bg-gradient-to-br from-yellow-300 via-orange-500 to-red-600 shadow-[0_0_80px_rgba(249,115,22,0.8)] flex items-center justify-center cursor-pointer active:scale-95 transition-transform"
                    onClick={() => speak("The Sun is a giant star that keeps us warm!")}
                  >
                    <div className="w-16 h-16 text-yellow-200">
                      <Icons.Sun />
                    </div>
                  </div>

                  {/* Orbits and Planets */}
                  {PLANETS.map((planet) => (
                    <div key={planet.name} className="absolute flex items-center justify-center pointer-events-none">
                      {/* Orbit Path */}
                      <div 
                        className="absolute border border-white/10 rounded-full"
                        style={{ width: `${planet.distance * 2}px`, height: `${planet.distance * 2}px` }}
                      />
                      
                      {/* Planet Spinner */}
                      <div 
                        className="absolute flex items-center justify-center"
                        style={{ 
                          width: `${planet.distance * 2}px`, 
                          height: `${planet.distance * 2}px`,
                          animation: isRotating ? `spin ${40 / planet.speed}s linear infinite` : 'none'
                        }}
                      >
                        {/* Touchable Planet Area */}
                        <div 
                          className="pointer-events-auto cursor-pointer absolute flex items-center justify-center group"
                          style={{ transform: `translateX(${planet.distance}px)` }}
                          onClick={() => handlePlanetSelect(planet)}
                        >
                          <div 
                            className="rounded-full shadow-lg transition-transform group-active:scale-90"
                            style={{ 
                              width: `${planet.size}px`, 
                              height: `${planet.size}px`,
                              backgroundColor: planet.color,
                              boxShadow: `inset -6px -6px 12px rgba(0,0,0,0.5), 0 0 15px ${planet.color}66`
                            }}
                          >
                            {planet.name === "Saturn" && (
                              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[180%] h-[30%] border-4 border-[#C5AB6E]/60 rounded-full rotate-[25deg]" />
                            )}
                          </div>
                          <span className="absolute -bottom-8 opacity-0 group-hover:opacity-100 bg-black/80 px-2 py-0.5 rounded text-xs whitespace-nowrap" style={{animation: isRotating ? `spin ${40 / planet.speed}s linear infinite reverse` : 'none'}}>
                            {planet.name}
                          </span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Header UI */}
              <div className="absolute top-0 left-0 right-0 p-6 flex justify-between items-start pointer-events-none">
                <div className="pointer-events-auto flex items-center gap-4">
                  <button 
                    onClick={() => window.location.href = '../../index.html'}
                    className="w-12 h-12 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-full flex items-center justify-center text-white active:scale-90 transition-transform hover:bg-slate-700"
                    title="Go to Home"
                  >
                    <div className="w-6 h-6"><Icons.Home /></div>
                  </button>
                  <div>
                    <h1 className="text-3xl font-bold bg-gradient-to-r from-yellow-300 to-orange-500 bg-clip-text text-transparent">
                      May's Space Adventure
                    </h1>
                    <p className="text-slate-400">Tap a planet to learn its secrets!</p>
                  </div>
                </div>
                <button 
                  onClick={() => setIsRotating(!isRotating)}
                  className="pointer-events-auto px-6 py-3 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl font-bold active:scale-95 transition-all hover:bg-slate-700"
                >
                  {isRotating ? 'Pause Planets' : 'Start Planets'}
                </button>
              </div>

              {/* Planet Detail Overlay */}
              {selectedPlanet && (
                <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-in fade-in duration-300 pointer-events-auto">
                  <div className="bg-slate-900 border border-slate-700 rounded-[2.5rem] w-full max-w-lg shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300">
                    <div className="relative h-40 flex items-center justify-center">
                      <div className="absolute inset-0 opacity-10" style={{ backgroundColor: selectedPlanet.color }} />
                      <div 
                        className="w-24 h-24 rounded-full shadow-2xl relative"
                        style={{ 
                          backgroundColor: selectedPlanet.color,
                          boxShadow: `inset -15px -15px 25px rgba(0,0,0,0.6), 0 0 30px ${selectedPlanet.color}44`
                        }}
                      >
                        {selectedPlanet.name === "Saturn" && (
                          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[180%] h-[30%] border-4 border-[#C5AB6E] rounded-full rotate-[25deg]" />
                        )}
                      </div>
                      <button 
                        onClick={() => setSelectedPlanet(null)}
                        className="absolute top-6 right-6 w-10 h-10 bg-black/40 rounded-full p-2 flex items-center justify-center hover:bg-black/60 transition-colors"
                      >
                        <Icons.Close />
                      </button>
                    </div>

                    <div className="p-8 pt-0">
                      <div className="flex justify-between items-center mb-6">
                        <h2 className="text-4xl font-bold">{selectedPlanet.name}</h2>
                        <button 
                          onClick={() => speak(`${selectedPlanet.name}. ${selectedPlanet.description}. Fun fact: ${selectedPlanet.fact}`)}
                          className="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center active:scale-90 transition-transform shadow-lg shadow-blue-900/40 hover:bg-blue-500"
                        >
                          <div className="w-8 h-8"><Icons.Volume /></div>
                        </button>
                      </div>

                      <p className="text-xl text-slate-300 leading-relaxed mb-8">
                        {selectedPlanet.description}
                      </p>

                      <div className="bg-slate-800/50 p-6 rounded-3xl border border-slate-700">
                        <div className="flex items-center gap-2 mb-2 text-yellow-400">
                          <div className="w-5 h-5"><Icons.Star /></div>
                          <span className="font-bold text-sm uppercase tracking-widest">Fun Fact</span>
                        </div>
                        <p className="text-lg text-white font-medium italic">"{selectedPlanet.fact}"</p>
                      </div>

                      <button 
                        onClick={() => setSelectedPlanet(null)}
                        className="w-full mt-8 py-5 bg-white text-black text-xl font-bold rounded-2xl active:scale-95 transition-transform hover:bg-slate-200"
                      >
                        Go Back to Space
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Intro Screen */}
              {showIntro && (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-slate-950 p-6 pointer-events-auto">
                  <div className="text-center max-w-sm animate-in fade-in slide-in-from-bottom-10 duration-700">
                    <div className="w-24 h-24 bg-gradient-to-br from-yellow-400 to-orange-600 rounded-full mx-auto mb-10 flex items-center justify-center shadow-2xl">
                      <div className="w-14 h-14 text-white"><Icons.Sun /></div>
                    </div>
                    <h2 className="text-5xl font-bold mb-4">Hi May!</h2>
                    <p className="text-xl text-slate-400 mb-12">
                      Ready to visit the planets? Tap them to hear what makes each one special!
                    </p>
                    <button 
                      onClick={() => {
                        setShowIntro(false);
                        speak("Hi May! Let's explore the solar system together.");
                      }}
                      className="w-full py-6 bg-blue-600 text-white text-2xl font-bold rounded-[2rem] shadow-xl active:scale-95 transition-transform hover:bg-blue-500"
                    >
                      Start Mission 🚀
                    </button>
                  </div>
                </div>
              )}

              <style>{`
                @keyframes spin {
                  from { transform: rotate(0deg); }
                  to { transform: rotate(360deg); }
                }
              `}</style>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
