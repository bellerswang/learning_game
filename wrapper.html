<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Opening game…</title>
</head>
<body>
  <p>Opening game…</p>
  <script>
    const requestedGame = new URLSearchParams(window.location.search).get("game");
    const isSafeRelativePath = requestedGame
      && !requestedGame.startsWith("/")
      && !requestedGame.includes("..")
      && !requestedGame.includes("\\")
      && !/^[a-z][a-z\d+.-]*:/i.test(requestedGame);
    window.location.replace(isSafeRelativePath ? requestedGame : "index.html");
  </script>
</body>
</html>
